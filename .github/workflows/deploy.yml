name: Deploy to GitHub Pages

# UNPUBLISHED at Mozn's request (2026-08-14): the Pages deployment was deleted
# and the repo is private again, so pushes must not trigger deploys. To go
# live again: make the repo public, enable Pages (build_type=workflow), restore
# the `push:` trigger below, and run this from the Actions tab.
on:
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 11 matches the local toolchain: pnpm 9 rejects a pnpm-workspace.yaml
      # that carries only settings (allowBuilds) and no `packages` field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm run build
        env:
          # Root-path static export for the custom domain moznjamous.org
          # (attached via public/CNAME — no /portfolio-website subpath).
          NEXT_PUBLIC_STATIC_EXPORT: "1"

      - name: Disable Jekyll (keep _next/)
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
